<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Silent Throttle</title> <!-- NAME 1: browser tab -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="stage" aria-label="3D night ride scene. Drag left or right to rotate the rider."></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud" id="hud" hidden>
    <span class="hud-title">SILENT THROTTLE</span> <!-- NAME 2: top-left title -->
    <div class="hud-controls">
      <button id="btn-music" aria-expanded="false" aria-controls="player">Music</button>
      <label class="vol">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
    </div>
  </header>

  <aside class="player" id="player" aria-label="Music player">
    <div class="now">
      <span class="now-title" id="now-title">Not playing</span>
      <span class="now-artist" id="now-artist"></span>
    </div>
    <div class="seek">
      <span id="t-cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
      <span id="t-dur">0:00</span>
    </div>
    <div class="ctrl">
      <button id="b-prev" aria-label="Previous song">Prev</button>
      <button id="b-back" aria-label="Back 10 seconds">−10s</button>
      <button id="b-play" aria-label="Play or pause">Pause</button>
      <button id="b-fwd" aria-label="Forward 10 seconds">+10s</button>
      <button id="b-next" aria-label="Next song">Next</button>
    </div>
    <nav class="list" id="playlist" aria-label="Playlist"></nav>
  </aside>

  <main class="landing" id="landing">
    <h1>SILENT THROTTLE</h1> <!-- NAME 3: start screen title -->
    <p>Ride in peace</p>
    <button id="btn-start" class="start" disabled>Loading…</button>
    <p class="hint" id="hint">Drag to rotate the rider · Press R to turn her around</p>
  </main>

<footer class="credit">
  Made by <strong>Viper Pilot</strong> with <span class="heart" aria-label="love">♥</span>

</footer>

  <div class="toast" id="error" role="alert" hidden></div>
  <div class="toast warn" id="audio-warning" role="status" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
